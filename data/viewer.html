<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D CNC Viewer</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080d16;color:#e8eef8;font:14px system-ui,sans-serif;overflow:hidden}#view{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#bar{position:fixed;z-index:2;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#101a2ae8;border:1px solid #2c405b;border-radius:10px;backdrop-filter:blur(8px)}button{border:1px solid #3c587b;background:#172842;color:#e8eef8;border-radius:6px;padding:7px 10px;cursor:pointer}button:hover{background:#21436a}#status{margin-left:auto;color:#a9bdd5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}#help{position:fixed;bottom:12px;left:12px;color:#91a4ba;background:#101a2acc;padding:8px 10px;border-radius:7px;font-size:12px}@media(max-width:620px){#status{order:2;margin-left:0;width:100%;max-width:none}#help{display:none}}
</style><script type="importmap">{"imports":{"three":"/three-lite.js"}}</script></head><body><canvas id="view"></canvas><div id="bar"><strong>3D G-code viewer</strong><button id="top">Top</button><button id="iso">Isometric</button><button id="reset">Reset</button><span id="status">Preparando…</span></div><div id="help">Arrastra: orbitar · Shift/botón central: pan · Rueda/pellizco: zoom</div><script type="module">
import { CNCThreeLite } from 'three';
if (new URLSearchParams(location.search).has('embed')) document.querySelector('#help').style.display='none';
const canvas=document.querySelector('#view'),status=document.querySelector('#status'),renderer=new CNCThreeLite(canvas);let bounds={minX:Infinity,minY:Infinity,minZ:Infinity,maxX:-Infinity,maxY:-Infinity,maxZ:-Infinity};
class Vertices{constructor(){this.a=new Float32Array(65536);this.n=0} add(a,b){this.ensure(6);this.a.set(a,this.n);this.a.set(b,this.n+3);this.n+=6;for(const p of[a,b]){bounds.minX=Math.min(bounds.minX,p[0]);bounds.minY=Math.min(bounds.minY,p[1]);bounds.minZ=Math.min(bounds.minZ,p[2]);bounds.maxX=Math.max(bounds.maxX,p[0]);bounds.maxY=Math.max(bounds.maxY,p[1]);bounds.maxZ=Math.max(bounds.maxZ,p[2])}}ensure(n){if(this.n+n<=this.a.length)return;const b=new Float32Array(Math.max(this.a.length*2,this.n+n));b.set(this.a);this.a=b}done(){return this.a.slice(0,this.n)}}
function words(line){const o={};line=line.replace(/;.*$/,'').replace(/\([^)]*\)/g,'');let m,re=/([A-Za-z])\s*([-+]?(?:\d*\.\d+|\d+\.?)(?:[eE][-+]?\d+)?)/g;while((m=re.exec(line))) (o[m[1].toUpperCase()]??=[]).push(+m[2]);return o}
function parse(text,cut,rapid,state){let lines=text.split(/\r?\n/);for(const line of lines){const w=words(line);if(w.G)for(const g of w.G){if(g===90)state.abs=true;else if(g===91)state.abs=false;else if(g===0||g===1||g===2||g===3)state.motion=g}if(w.M)for(const m of w.M){if(m===3||m===4)state.spindle=true;if(m===5)state.spindle=false}if(!state.motion||(!w.X&&!w.Y&&!w.Z))continue;const a=[state.x,state.y,state.z],b=[state.x,state.y,state.z];for(const [k,i]of[['X',0],['Y',1],['Z',2]])if(w[k])b[i]=state.abs?w[k].at(-1):b[i]+w[k].at(-1);const out=(state.motion===0||!state.spindle)?rapid:cut;if((state.motion===2||state.motion===3)&&w.I&&w.J){const cx=a[0]+w.I.at(-1),cy=a[1]+w.J.at(-1),r=Math.hypot(a[0]-cx,a[1]-cy),sa=Math.atan2(a[1]-cy,a[0]-cx),ea=Math.atan2(b[1]-cy,b[0]-cx);let d=ea-sa;if(state.motion===2&&d>=0)d-=Math.PI*2;if(state.motion===3&&d<=0)d+=Math.PI*2;const steps=Math.min(180,Math.max(2,Math.ceil(Math.abs(d)/(Math.PI/18))));let p=a;for(let i=1;i<=steps;i++){const t=i/steps,q=[cx+r*Math.cos(sa+d*t),cy+r*Math.sin(sa+d*t),a[2]+(b[2]-a[2])*t];out.add(p,q);p=q}}else out.add(a,b);[state.x,state.y,state.z]=b}}
async function load(){const query=new URLSearchParams(location.search),name=query.get('name'),source=query.get('source');if(!name){status.textContent='Falta ?name=/archivo.gcode';return}status.textContent='Downloading 0%';const url='/api/file?name='+encodeURIComponent(name)+(source?'&source='+encodeURIComponent(source):'');const res=await fetch(url);if(!res.ok)throw new Error(await res.text());const total=+(res.headers.get('X-File-Size')||res.headers.get('Content-Length')||0),reader=res.body.getReader(),dec=new TextDecoder(),cut=new Vertices(),rapid=new Vertices(),state={x:0,y:0,z:0,abs:true,spindle:false,motion:0};let pending='',got=0;try{for(;;){const {value,done}=await reader.read();if(done)break;got+=value.byteLength;pending+=dec.decode(value,{stream:true});const at=pending.lastIndexOf('\n');if(at>=0){parse(pending.slice(0,at+1),cut,rapid,state);pending=pending.slice(at+1)}status.textContent=total?'Analyzing '+Math.min(100,Math.round(got*100/total))+'%':'Analyzing '+(got/1048576).toFixed(1)+' MB';await new Promise(requestAnimationFrame)}}catch(e){status.textContent='Connection interrupted: showing the part received'}if(pending)parse(pending,cut,rapid,state);if(!isFinite(bounds.minX))throw new Error('No G0/G1/G2/G3 movements were found.');renderer.setPaths(cut.done(),rapid.done());renderer.frame(bounds);status.textContent='Ready · cut'+(cut.n/6).toLocaleString()+' · air '+(rapid.n/6).toLocaleString()}
let pointers=new Map,last=null;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);last=[e.clientX,e.clientY,e.shiftKey||e.button===1]});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p=[e.clientX,e.clientY];pointers.set(e.pointerId,p);const ps=[...pointers.values()];if(ps.length===2){const d=Math.hypot(ps[0][0]-ps[1][0],ps[0][1]-ps[1][1]);if(last?.d)renderer.zoom(last.d/d);last={d};return}if(last){const dx=p[0]-last[0],dy=p[1]-last[1];last[2]?renderer.pan(dx,dy):renderer.rotate(dx,dy);last=[p[0],p[1],last[2]]}});function end(e){pointers.delete(e.pointerId);last=null}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('wheel',e=>{e.preventDefault();renderer.zoom(Math.exp(e.deltaY*.001))},{passive:false});document.querySelector('#top').onclick=()=>renderer.top();document.querySelector('#iso').onclick=()=>renderer.iso();document.querySelector('#reset').onclick=()=>renderer.frame(bounds);load().catch(e=>status.textContent='Error: '+e.message);
</script></body></html>
